[package]
name = "memcardpro-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
main_error = "0.1"
regex = "1.13.1"
sqlite = "0.37"
thiserror = "2"


[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
similar_names = "allow"
# DEVELOPING LINTS
nursery = { level = "warn", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
